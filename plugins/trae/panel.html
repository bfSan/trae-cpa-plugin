<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
/* Theme tokens aligned with CPA management panel (key-policy / themes.scss):
   default :root = light (paper); data-theme=white | dark; embedded iframe syncs parent.
   Mirrors workbuddy/panel.html so the trae panels share the same look-and-feel. */
:root{
  --bg:#faf9f5;--card:#ffffff;--border:#e3e1db;--fg:#2d2a26;--mut:#6d6760;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#10b981;--warn:#e0aa14;--err:#c65746;
  --surface:#f0eee8;--surface-muted:#e9e6df;--btn-sec:#eef1f6;--btn-sec-hover:#e4e8ef;
  --input-bg:#ffffff;--code-bg:#f3f4f6;--code-fg:#374151;--placeholder:rgba(109,103,96,.55);
  --ok-soft:rgba(16,185,129,.10);--ok-border:rgba(16,185,129,.30);
  --warn-soft:rgba(224,170,20,.12);--warn-border:rgba(224,170,20,.32);
  --err-soft:rgba(198,87,70,.10);--err-border:rgba(198,87,70,.30);
  --mut-soft:rgba(109,103,96,.12);--mut-border:rgba(109,103,96,.28);
  --scrim:rgba(45,42,38,.35);--toast-shadow:0 10px 28px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.04);
  --acc-ring:rgba(76,141,255,.18);--radius-md:12px;--radius-lg:16px;
  color-scheme:light
}
:root[data-theme="white"]{
  --bg:#f5f5f5;--card:#ffffff;--border:#e6e6e6;--fg:#1f1f1f;--mut:#707070;
  --surface:#fafafa;--surface-muted:#efefef;--btn-sec:#f0f0f0;--btn-sec-hover:#e8e8e8;
  --input-bg:#ffffff;--code-bg:#f3f4f6;--code-fg:#374151;--placeholder:rgba(112,112,112,.55);
  --scrim:rgba(0,0,0,.32);--toast-shadow:0 10px 28px rgba(0,0,0,.10),0 0 0 1px rgba(0,0,0,.04);
  color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#1e1d1b;--card:#26241f;--border:#3a3833;--fg:#ede9e3;--mut:#9a948c;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#34d399;--warn:#f0c050;--err:#e07a6a;

  --warn-soft:rgba(240,192,80,.14);--warn-border:rgba(240,192,80,.38);
  --err-soft:rgba(224,122,106,.12);--err-border:rgba(224,122,106,.38);
  --mut-soft:rgba(154,148,140,.16);--mut-border:rgba(154,148,140,.32);
  --scrim:rgba(0,0,0,.55);--toast-shadow:0 10px 28px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03);
  --acc-ring:rgba(76,141,255,.28);

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin-bottom:20px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
button{background:var(--acc);color:var(--on-acc);border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px}
button.sec{background:var(--btn-sec);color:var(--fg)}button.sec:hover{background:var(--btn-sec-hover)}button:disabled{opacity:.5;cursor:default}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}

.badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-border)}
.badge.exhausted{background:var(--err-soft);color:var(--err);border:1px solid var(--err-border)}
.badge.pro{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border)}
.badge.cooling{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn-border)}

.pb-bar{height:100%;background:var(--ok);border-radius:99px;transition:width .6s ease}

.toasts{position:fixed;top:16px;right:16px;display:flex;flex-direction:column;gap:10px;z-index:9999;max-width:360px}
.toast{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--acc);border-radius:var(--radius-md);padding:14px 18px;font-size:13px;box-shadow:var(--toast-shadow);transform:translateX(120%);opacity:0;transition:transform .3s cubic-bezier(.2,.9,.3,1.1),opacity .25s;cursor:pointer;word-break:break-all}
.toast.show{transform:translateX(0);opacity:1}
.toast.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.toast.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.toast.err{border-left-color:var(--err);background:var(--err-soft)}
button.done{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-border);cursor:default;opacity:1}
button.done:disabled{opacity:1}
.toast .t{font-weight:600;margin-bottom:3px}
.toast .d{color:var(--mut);font-size:12px;line-height:1.45}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--on-acc);border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
button .spin{border-color:var(--on-acc);border-top-color:transparent}
.loading{color:var(--mut);text-align:center;padding:40px}
/* Card rows, tier emphasis and activity surfaces follow WorkBuddy's panel. */
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.ftag{background:var(--surface);border:1px solid var(--border);color:var(--mut);border-radius:99px;padding:5px 14px;font-size:12px;cursor:pointer;font-weight:600;white-space:nowrap}
.ftag.active{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}.ftag .cnt{font-size:10px;opacity:.75;margin-left:4px}
.filter-chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#accountTools .field-input{flex:1 1 180px}#accountCount{white-space:nowrap}.field-input{min-width:0}.local-sort{background:var(--input-bg);border:1px solid var(--border);border-radius:8px;padding:7px;color:var(--fg)}
.login-help{margin-bottom:16px}.login-help summary{cursor:pointer;color:var(--mut);font-size:12px}.login-help[open] summary{margin-bottom:10px}.login-note{font-size:12px;color:var(--mut);margin:8px 0}
.model-table-wrap{overflow-x:auto;max-width:100%}.model-table{min-width:880px}.model-rows{display:flex;flex-direction:column;gap:6px;padding-right:2px}
.model-head,.model-row{display:grid;grid-template-columns:38px minmax(150px,1.2fr) repeat(3,minmax(160px,1fr)) 86px;align-items:center;gap:10px;padding:8px 10px}
.model-head{color:var(--mut);font-size:12px;font-weight:700;border-bottom:1px solid var(--border)}.model-row{border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.drag-handle{cursor:grab;touch-action:none;background:var(--btn-sec);color:var(--mut);border:1px solid var(--border);border-radius:99px;padding:3px 9px;font-size:18px}.drag-handle:active{cursor:grabbing}.drag-handle:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.model-id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;font-weight:600;overflow-wrap:anywhere}.model-name{font-size:12px;color:var(--mut);overflow-wrap:anywhere}.realm-cell{min-width:0}.realm-facts{display:flex;flex-direction:column;gap:4px;color:var(--mut);font-size:12px;white-space:normal;overflow-wrap:anywhere;line-height:1.6}.realm-facts>span{min-width:0}.realm-facts>span:first-child{color:var(--fg)}
.realm-facts span.ctx-default,.realm-facts span.thinking-default{color:var(--acc);font-weight:700}.model-actions{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}.model-actions>*{white-space:nowrap}.model-actions .ftag{padding:3px 8px;font-size:12px}.model-actions .hidden-model{color:var(--warn);border-color:var(--warn-border)}.mg-meta{color:var(--mut);font-size:11px}.mg-locked{color:var(--mut)}
.promo-box{padding:12px 16px;margin:16px 0}.promo-hd{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.promo-title{font-weight:700;font-size:14px;cursor:pointer;user-select:none}.promo-live{color:var(--ok)}.promo-live.zero{color:var(--mut)}.promo-meta{color:var(--mut);font-size:12px}.promo-list{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.promo-row{display:grid;grid-template-columns:minmax(84px,auto) minmax(140px,1.3fr) minmax(64px,auto) minmax(60px,auto) minmax(150px,1.2fr);gap:10px;align-items:center;padding:7px 9px;border-radius:8px;background:var(--surface);font-size:12px;border-left:3px solid var(--mut-border)}.promo-row.on{border-left-color:var(--ok);background:var(--ok-soft)}.promo-row.off{opacity:.72}.promo-badge{font-weight:700;color:var(--mut)}.promo-badge.on,.promo-state.on{color:var(--ok)}.promo-model{font-family:ui-monospace,monospace;font-weight:600;overflow-wrap:anywhere}.promo-price{font-weight:700;font-variant-numeric:tabular-nums}.promo-realm,.promo-state{color:var(--mut);font-size:11px}
.card{min-width:0}#modelCtlCard{margin-top:16px}.model-status{font-size:12px;color:var(--mut);margin:6px 0 10px}.model-status.err{color:var(--err)}
@media(max-width:640px){.wrap{padding:18px 12px}#accountTools .field-input{flex-basis:100%}.promo-row{grid-template-columns:1fr 1fr}.bar>*{max-width:100%}}
</style>
<script>
/* Early theme sync (before body paint): mirror CPA parent data-theme when
   embedded; standalone falls back to prefers-color-scheme. Same semantics as
   workbuddy/panel.html / cpa-plugin-key-policy themeSync. */
(function(){
  var ATTR="data-theme";
  function embedded(){try{return window.self!==window.top}catch(e){return false}}
  function apply(t){
    var el=document.documentElement;
    if(t==="white"||t==="dark")el.setAttribute(ATTR,t);
    else el.removeAttribute(ATTR);
  }
  function parentTheme(){
    if(!embedded())return null;
    try{
      var raw=window.parent.document.documentElement.getAttribute(ATTR);
      if(raw==="white"||raw==="dark")return raw;
      return "light";
    }catch(e){return null}
  }
  function systemTheme(){
    try{return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}catch(e){return "light"}
  }
  function sync(){apply(parentTheme()||systemTheme())}
  sync();
  window.__traeThemeSync=function(){
    sync();
    if(!embedded()){
      try{
        var mq=window.matchMedia("(prefers-color-scheme: dark)");
        var on=function(){sync()};
        if(mq.addEventListener)mq.addEventListener("change",on);
        else if(mq.addListener)mq.addListener(on);
      }catch(e){}
      return;
    }
    try{
      var parentEl=window.parent.document.documentElement;
      new MutationObserver(sync).observe(parentEl,{attributes:true,attributeFilter:[ATTR]});
      window.addEventListener("storage",function(e){if(e.key==="cli-proxy-theme")sync()});
    }catch(e){}
  };
})();
</script>

<body>
<div class="wrap">
  <h1 id="title">Trae 账号面板</h1>
  <div class="sub">CN / SOLO / Intl 账号与额度 · Intl 不提供签到</div>
  <div id="authBox" class="card" style="display:none;margin-bottom:16px">
    <div class="login-note">连接 CPA 管理接口；密钥仅保留在本次浏览器会话。</div>
    <div style="display:flex;gap:8px"><input id="keyInput" type="password" placeholder="management key（可选）" class="field-input"><button onclick="saveKey()">连接</button></div>
  </div>
  <div class="bar" id="toolbar">
    <button class="sec" onclick="startPanelLogin('cn',this)">登录 CN</button>
    <button class="sec" onclick="startPanelLogin('solo',this)">登录 SOLO</button>
    <button class="sec" onclick="startPanelLogin('intl',this)">登录 Intl</button>
    <button id="refreshBtn" onclick="load(true,this)">刷新</button>
    <button class="sec" onclick="checkinAll(this)">全部签到</button>
    <label class="toggle" id="autoCheckinLabel" title="每日 09:00（服务器本地时间）"><input id="autoCheckin" type="checkbox" disabled onchange="saveAutoCheckin(this)">自动签到 <span id="autoCheckinStatus">读取中</span></label>
    <span class="toggle" id="svtime"></span>
  </div>
  <details class="login-help" id="loginHelp">
    <summary>登录状态 / 回调恢复</summary>
    <div id="loginLaunch"></div><div id="loginStatus" class="login-note">登录状态：加载中…</div>
    <div class="login-note">授权后若无法连接本机回调地址，粘贴本次完整链接继续。服务重启后仍可恢复有效登录；仅过期或明确失效时重新发起。</div>
    <div style="display:flex;gap:8px"><input id="cbPaste" type="text" placeholder="http://127.0.0.1:&lt;port&gt;/authorize?isRedirect=true&amp;authCodeInfo=…" class="field-input"><button onclick="submitCallbackURL(this)">完成登录</button></div>
  </details>
  <div class="filter-bar" id="accountTools"><div id="accountFilters" class="filter-chips" aria-label="账号分区"></div><input id="accountSearch" class="field-input" type="search" placeholder="搜索昵称 / 标签 / 文件 / UID" aria-label="搜索账号" oninput="renderAccounts()"><select id="accountSort" class="local-sort" aria-label="本地显示排序" onchange="renderAccounts()"><option value="original">原始顺序</option><option value="name">名称排序（仅显示）</option></select><span class="toggle" id="accountCount"></span></div>
  <div id="grid" class="grid"><div class="loading">加载中…</div></div>
  <details class="card promo-box" id="promoBox" open>
    <summary class="promo-title">上游活动 <span class="promo-live zero" id="promoCount">待核实</span></summary>
    <div class="promo-meta" id="promoMeta">活动信息未上报</div>
    <div class="promo-list" id="promoList"></div>
  </details>
  <div class="card" id="modelCtlCard">
    <h2>模型列表 <button id="modelRefreshBtn" class="sec" onclick="modelGroupsRefresh(this)">刷新目录</button></h2>
    <div id="modelStatus" class="model-status" aria-live="polite">加载中…</div>
    <div id="modelGroupsBox"><div class="loading">加载中…</div></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script>
/* providerName: derived from URL (/v0/resource/plugins/<provider>/panel) so the
   same compiled panel.html works for trae-cn and trae-solo-cn. */
const providerName = (function(){
  const parts = window.location.pathname.split('/').filter(Boolean);
  // /v0/resource/plugins/<provider>/panel  →  parts[3]
  // /plugins/<provider>/panel              →  parts[1]
  if(parts.length>=4 && parts[0]==="v0" && parts[1]==="resource" && parts[2]==="plugins") return parts[3];
  if(parts.length>=2 && parts[0]==="plugins") return parts[1];
  return "trae-solo-cn";
})();
const API = "/v0/management/plugins/" + providerName;
document.getElementById("title").textContent =
  providerName==="trae-solo-cn" ? "Trae SOLO CN 账号面板" :
  providerName==="trae-cn"      ? "Trae CN 账号面板"     :
  "Trae 账号面板";

/* ---------- management key acquisition (3 fallbacks, zero config) ----------
   1) CPA main panel localStorage "cli-proxy-auth" (XOR+base64, same-origin
      iframe embed) — same approach as cpa-plugin-key-policy / workbuddy.
   2) ?key= URL param (cleaned from history after read, kept in sessionStorage).
   3) Manual input (sessionStorage only, never persisted).
   NOTE: trae-* plugins do not enforce a plugin-layer key (no checkManagementAuth),
   so the panel attempts every call with whatever key it has — the host CPA
   middleware is the actual guard. On 401 we surface the manual input box. */
const ENC_PREFIX = "enc::v1::";
const SECRET_SALT = "cli-proxy-api-webui::secure-storage";
const PANEL_STORE = "cli-proxy-auth";
const SS_KEY = providerName + "-mgmt-key";

function _enc(t){return new TextEncoder().encode(t)}
function _dec(b){return new TextDecoder().decode(b)}
function _keyBytes(){try{return _enc(SECRET_SALT+"|"+window.location.host+"|"+navigator.userAgent)}catch(e){return _enc(SECRET_SALT)}}
function _xor(d,k){const r=new Uint8Array(d.length);for(let i=0;i<d.length;i++)r[i]=d[i]^k[i%k.length];return r}
function _b64e(b){let s="";for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)}
function _b64d(s){const bin=atob(s);const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b}
function deobfuscate(p){if(!p||!p.startsWith(ENC_PREFIX))return p;try{return _dec(_xor(_b64d(p.slice(ENC_PREFIX.length)),_keyBytes()))}catch(e){return p}}
function isEmbedded(){try{return window.self!==window.top}catch(e){return false}}

function readPanelKey(){
  if(!isEmbedded())return null;
  let raw;try{raw=localStorage.getItem(PANEL_STORE)}catch(e){return null}
  if(!raw)return null;
  try{
    const parsed=JSON.parse(deobfuscate(raw));
    const st=(parsed&&parsed.state)||parsed||{};
    return typeof st.managementKey==="string"&&st.managementKey?st.managementKey:null;
  }catch(e){return null}
}
function readUrlKey(){
  const m=new URLSearchParams(window.location.search).get("key");
  if(m){history.replaceState(null,"",window.location.pathname)}
  return m;
}
function getKey(){
  return sessionStorage.getItem(SS_KEY)||readPanelKey()||readUrlKey();
}
function saveKey(){
  const v=document.getElementById("keyInput").value.trim();
  if(!v)return;
  sessionStorage.setItem(SS_KEY,v);
  document.getElementById("authBox").style.display="none";
  load(false);
}
function showAuth(){document.getElementById("authBox").style.display="block";const i=document.getElementById("keyInput");i&&i.focus()}
function authHeaders(k){return k?{"Authorization":"Bearer "+k}:{}}
/* --------------------------------------------------------------------------- */

function toast(title, kind="ok", detail=""){
  const box=document.getElementById("toasts");
  const el=document.createElement("div");
  el.className="toast "+kind;
  el.innerHTML='<div class="t"></div>'+(detail?'<div class="d"></div>':'');
  el.querySelector(".t").textContent=title;
  if(detail)el.querySelector(".d").textContent=detail;
  box.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("show")));
  const kill=()=>{el.classList.remove("show");setTimeout(()=>el.remove(),300)};
  el.onclick=kill;
  setTimeout(kill, kind==="err"?6000:4000);
  while(box.children.length>5)box.firstChild.remove();
}
function busy(btn, on){
  if(!btn)return;
  if(on){btn.dataset.orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span>处理中…'}
  else{btn.disabled=false;if(btn.dataset.orig)btn.innerHTML=btn.dataset.orig}
}
function markCheckinDone(btn){
  if(!btn)return;
  btn.disabled=true;
  btn.className="done";
  btn.innerHTML="已签到";
  btn.dataset.orig="已签到";
}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escAttr(s){return esc(s)}

function progressHTML(cr,acct){
  if(!cr)return `<div class="pb"><div class="pb-label"><span>额度</span><span>${acct&&acct.disabled?'未查询（账号已禁用）':'未查询'}</span></div></div>`;
  const finite=v=>typeof v==='number'&&Number.isFinite(v);
  const when=cr.fetched_at?' · 快照 '+promoTime(cr.fetched_at,''):'';
  const block=(label,value,total,used,packs)=>{
    const ratio=finite(used)&&used>=0&&finite(total)&&total>0?Math.max(0,Math.min(100,used/total*100)):null;
    const percent=ratio==null?'':Math.round(ratio)+'%';
    const meta=[label,'剩余 '+value,finite(used)?'已用 '+used:'已用未上报',finite(total)?'总额 '+total:'总额未上报',Number.isInteger(packs)&&packs>0?packs+' 个包':''].filter(Boolean).join(' · ')+when;

  };
  let out='';
  if(cr.credits_pool_known===true)out+=block('积分',cr.credits_pool_unlimited?'不限':finite(cr.credits_pool_remain)?cr.credits_pool_remain:'未上报',cr.credits_pool_total,cr.credits_pool_used,cr.credits_pool_pack_count);

  }
  if(!out)out='<div class="pb"><div class="pb-label"><span>剩余额度</span><span>未上报</span></div>'+(cr.fast_request_per>0?`<div class="pb-meta">快请求/月 ${esc(cr.fast_request_per)}</div>`:'')+'</div>';
  return out;
}

function lazyLoadCredits(accounts){
  // For cards whose credits are missing/stale, fetch /credits per-account.
  // trae /credits does a live upstream call (slow) — parallel is OK for small pools.
  const need=accounts.filter(a=>!a.credits && !a.error && !a.disabled);
  if(!need.length) return;
  need.forEach(a=>{
    const idx=a.auth_index;
    api(`/credits?auth_index=${encodeURIComponent(idx)}`)
      .then(d=>{
        const res=(d.results||[]).find(x=>x.auth_index===idx)||{};
        if(d.error){ a.error=d.error; }
        if(res.error){ a.error=res.error; }
        applyCreditsResult(a, res);
        updateOneCard(a);
      })
      .catch(()=>{
        // Retry once after 2s.
        setTimeout(()=>{
          api(`/credits?auth_index=${encodeURIComponent(idx)}`)
            .then(d=>{
              const res=(d.results||[]).find(x=>x.auth_index===idx)||{};
              if(d.error||res.error){ a.error=d.error||res.error; updateOneCard(a); return; }
              applyCreditsResult(a, res);
              updateOneCard(a);
            })
            .catch(()=>{ a.error="积分查询失败"; updateOneCard(a); });
        },2000);
      });
  });
}

async function api(path, opts={}){
  // Unlike workbuddy, trae-* has no plugin-layer key check, so we do NOT
  // throw "需要管理密钥" when no key is available — we just attempt the call.
  // The CPA host middleware is the actual guard; on 401 we surface the key box.
  if(Date.now()<authFailUntil){
    throw new Error("认证多次失败，请稍后重试（防 IP 封禁）");
  }
  const k=getKey();
  const r=await fetch(API+path,{...opts,credentials:'omit',headers:{...(opts.headers||{}),...authHeaders(k)}});
  if(r.status===401){
    authFailCount++;
    showAuth();
    if(authFailCount>=3){
      authFailUntil=Date.now()+60000;
      authFailCount=0;
      throw new Error("认证多次失败，请检查管理密钥后 60s 再试");
    }
    throw new Error("management key 无效或缺失");
  }
  if(r.status===403){
    authFailCount++;
    let body="";try{body=await r.text()}catch(_){}
    if(/IP banned|too many failed/i.test(body)){
      let waitMs=60000;
      const m=body.match(/(\d+)\s*m(?:in(?:ute)?s?)?\s*(\d+)\s*s/i)||body.match(/(\d+)\s*m/i);
      if(m){
        const mins=parseInt(m[1],10)||0;
        const secs=m[2]?parseInt(m[2],10):0;
        waitMs=Math.min(Math.max((mins*60+secs)*1000,30000),30*60*1000);
      }
      authFailUntil=Date.now()+waitMs;
      throw new Error(body.trim()||"IP 被封禁，请稍后再试");
    }
    if(authFailCount>=3){authFailUntil=Date.now()+60000;authFailCount=0;}
    throw new Error(body.trim()||"禁止访问 (403)");
  }
  authFailCount=0;
  const text=await r.text();
  if(!text){
    throw new Error(`空响应 (${r.status}) — 路由可能未注册或上游返回空`);
  }
  try{
    const data=JSON.parse(text);
    if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);
    return data;
  }catch(e){
    throw new Error(`JSON 解析失败 (${r.status}): ${text.slice(0,100)}`);
  }
}

 let text=labels[f.category]||'授权回调已收到，但凭证交换未完成';

    lines.push("\u23f3 登录等待中（"+(d.variant||"cn")+"）· 已等待 "+Math.floor(age/60)+" 分 "+(age%60)+" 秒 · 剩余约 "+Math.ceil(ttl/60)+" 分钟");

    if(d.callback_received){
      lines.push(d.stage==='token'||d.stage==='result'?'凭证已取得，正在完成账号保存；列表出现账号后才算完成。':'授权回调已收到，正在交换凭证；这还不代表账号已保存。');
    }
    lines.push(d.restored
      ? "该登录已从磁盘恢复：把浏览器地址栏的完整回调链接粘贴到下方即可。"
      : "若浏览器登录后停在「无法连接」或一直未跳转，复制地址栏完整链接粘贴到下方粘贴框即可完成登录。");
    el.innerHTML=lines.map(function(x){return x.replace(/&/g,'&amp;').replace(/</g,'&lt;');}).join('<br>');
    el.style.color = d.listener_alive ? "var(--mut)" : "#c0392b";
  }catch(e){

  }
}

async function load(force, btn){
  const g=document.getElementById("grid");
  if(force){
    loadAutoCheckin();
    if(!btn) btn=document.getElementById("refreshBtn");
    busy(btn, true);
  }
  try{
    // force: call /refresh (forces token+credit refresh server-side, returns the
    //        refreshed dashboard). non-force: call /accounts (cache snapshot).
    //        Both /accounts and /refresh return {accounts, provider, server_time}.
    const d = force
      ? await api("/refresh", {method:"POST"})
      : await api("/accounts");
    // Unified panel (v0.12.2): Intl accounts ride in the same grid.
    // Intl accounts share the factual credits query but do not support check-in.
    let intlAccounts=[];
    try{ const di=await api("/intl/accounts"); intlAccounts=di.accounts||[]; }catch(e){}
    document.getElementById("svtime").textContent="服务器 "+(d.server_time?promoTime(d.server_time,""):"时间未上报");
    if(d.error){
      g.innerHTML='<div class="loading">'+esc(d.error)+"</div>";
      if(force) toast("刷新失败", "err", d.error);
      return;
    }
    const accounts=[];
    // v0.12.25: dedupe by auth_index — the CN list (all trae-* files) and the
    // intl list overlapped before the server-side filter, and concatenated
    // here without a key check, rendering the same account twice.
    const seenIdx=new Set();
    (d.accounts||[]).forEach(a=>{ if(a.auth_index&&seenIdx.has(a.auth_index))return; if(a.auth_index)seenIdx.add(a.auth_index); accounts.push(Object.assign({variant:a.variant||"cn"},a)); });
    (intlAccounts||[]).forEach(a=>{ if(a.auth_index&&seenIdx.has(a.auth_index))return; if(a.auth_index)seenIdx.add(a.auth_index); accounts.push(Object.assign({variant:"intl"},a)); });
    lastAccounts=accounts;
    if(d.promotions)renderPromotions(d.promotions);
    const modelSynced=force?await syncModelsAfterAuth():true;

    if(!accounts.length){
      g.innerHTML='<div class="loading">暂无 '+esc(providerName)+' 账号</div>';
      renderAccounts();
      if(force) toast("数据已刷新", "warn", "暂无账号");
      return;
    }
    renderAccounts();
    lazyLoadCredits(accounts);
    if(force){
      const errN=accounts.filter(a=>a.error).length;
      let extra=accounts.length+" 个账号";
      if(errN) extra+=" · "+errN+" 个有错误";
      if(d.model_refresh||[...(Array.isArray(d.results)?d.results:[]),...(Array.isArray(d.items)?d.items:[])].some(x=>x.model_refresh))authRefreshToast(d,modelSynced);
      else if(!modelSynced)toast("数据已刷新，模型目录回读失败","warn",extra);
      else if(errN) toast("数据已刷新", "warn", extra);
      else toast("数据已刷新", "ok", extra);
    }
  }catch(e){
    if(force) toast("刷新失败", "err", e.message||String(e));
    if(!force || !g.querySelector(".card")){
      g.innerHTML='<div class="loading">'+esc(e.message||String(e))+"</div>";
    }
  }finally{
    if(force) busy(btn, false);
  }
}

async function checkin(idx, uid, btn){

async function modelOrderSave(){
  if(modelBusy||!modelStateValid)return;
  const ids=catalogRows(false).map(x=>x.id);if(!ids.length)return;
  modelBusy=true;const epoch=++modelEpoch;modelStatus("正在保存排序并回读…");renderModelGroups();
  try{
    await hostAPI("/plugins/"+providerName+"/config",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({model_order:ids})});
    const catalogEpoch=++modelCatalogEpoch;
    const [config,runtime]=await Promise.all([hostAPI("/plugins/"+providerName+"/config"),api("/models/groups")]);
    if(epoch!==modelEpoch)return;
    validateGroups(runtime);
    if(!config||JSON.stringify(config.model_order)!==JSON.stringify(ids)||JSON.stringify(runtime.model_order)!==JSON.stringify(ids))throw Error("宿主或运行时回读顺序不一致");
    if(catalogEpoch===modelCatalogEpoch){modelGroupsData=runtime;renderPromotions(runtime.promotions);}
    modelRowOrder=[...runtime.model_order];modelStatus("排序已保存并核实");toast("排序已保存并核实");
  }catch(e){
    if(epoch===modelEpoch){toast("排序未确认","err",e.message);await modelCtlLoad(false,true);modelStatus("排序未确认；"+(modelStateValid?"已重新读取当前设置":"请刷新目录核实"),true);}
  }finally{modelBusy=false;renderModelGroups()}
}
function authRefreshToast(response,synced){
  const entries=response?[...(Array.isArray(response.results)?response.results:[]),...(Array.isArray(response.items)?response.items:[])]:[];
  const statuses=response&&response.model_refresh?[response.model_refresh]:entries.map(x=>x.model_refresh).filter(Boolean);
  const errors=entries.filter(x=>x.error);
  if(errors.length){toast('账号刷新部分失败','warn',errors.length+' 个账号有错误'+(statuses.some(s=>s.error||s.updated===false||s.status==='partial')?'；模型目录亦未完整更新':'')+(!synced?'；目录回读失败':''));return;}
  const failed=statuses.filter(s=>s.error||s.updated===false||s.status==='partial'||s.status==='failed');
  if(failed.length){toast(statuses.some(s=>s.updated===true)?'凭证已刷新，模型目录部分更新':'凭证已刷新，模型目录未更新','warn',failed.map(s=>s.error||s.status||'待核实').join('；')+(!synced?'；目录回读失败':''));return;}
  if(!synced){toast('凭证已刷新，模型目录回读失败','warn','当前显示旧快照，请手动核实');return;}
  if(statuses.length&&statuses.every(s=>s.updated===true))toast('凭证与模型目录已刷新','ok');
  else toast('凭证已刷新','ok','已同步目录快照；上游目录刷新状态未确认');
}
async function syncModelsAfterAuth(){
  const epoch=++modelCatalogEpoch;
  try{
    // The credential endpoint owns upstream refresh. Read its persisted result
    // exactly once, without refreshing peers or writing capability selections.
    const groups=validateGroups(await api('/models/groups'));
    if(epoch!==modelCatalogEpoch)return false;
    modelGroupsData=groups;
    if(!modelBusy)modelRowOrder=[...(groups.model_order||[])];
    renderPromotions(groups.promotions);renderModelGroups();return true;
  }catch(e){
    if(epoch!==modelCatalogEpoch)return false;
    if(modelGroupsData)modelGroupsData={...modelGroupsData,groups:modelGroupsData.groups.map(g=>({...g,models:(g.models||[]).map(m=>({...m,multiplier:null,multiplier_state:'stale'}))}))};
    if(promotionsData)renderPromotions({...promotionsData,items:(promotionsData.items||[]).map(i=>({...i,snapshot_stale:true}))});
    if(modelGroupsData)renderModelGroups();
    modelStatus('目录回读失败：'+(e.message||String(e)),true);return false;
  }
}
async function modelGroupsRefresh(){
  if(modelBusy||modelLoading)return;
  if(await modelCtlLoad(true))toast("模型目录已刷新");
}
async function modelToggle(id){
  if(modelBusy||!modelStateValid)return;
  const row=catalogRows().find(r=>r.id===id);if(!row)return;
  const state=modelRowState(row);if(state.locked)return;
  // A partially hidden row means hide its remaining visible channels. Restoring
  // an all-hidden row removes exact exclusions only, never broad wildcards.
  const targets=state.channels;
  modelEdits=new Map(targets.map(c=>[c.realm+"\n"+c.id,state.hidden]));
  await modelGroupsSave();
}
function exclusionPatch(existing,realm){
  let next=[...existing];
  for(const [key,checked] of modelEdits){
    const [r,id]=key.split("\n");if(r!==realm)continue;
    if(exclusionMatches(id,[...globalExclSet()]))continue;
    if(checked){
      const broad=next.filter(p=>p.includes("*")&&exclusionMatches(id,[p]));
      if(broad.length)throw Error(id+" 被渠道通配规则隐藏，请先在宿主全局页调整规则");
      next=next.filter(p=>p.toLowerCase()!==id.toLowerCase());
    }else if(!exclusionMatches(id,next))next.push(id);
  }
  return next;
}
async function modelGroupsSave(){
  if(modelBusy||!modelStateValid||!modelEdits.size)return;
  modelBusy=true;const epoch=++modelEpoch,edits=new Map(modelEdits);modelStatus("正在保存隐藏设置并回读…");renderModelGroups();
  try{
    const fresh=exclusionMap(await hostAPI("/oauth-excluded-models"));
    if(epoch!==modelEpoch)return;
    modelExclMap=fresh;modelEdits=edits;
    // Re-evaluate locks against the fresh host source, not the rendered snapshot.
    // A previously locked channel may now be writable; newly locked channels
    // stay untouched while the remaining channels can still be restored.
    for(const [key] of edits)if(exclusionMatches(key.split("\n")[1],[...globalExclSet()]))edits.delete(key);
    if(!edits.size)throw Error("模型已被全局锁定");
    const expected={},patches=[];
    for(const realm of ['cn','solo','intl']){
      if(![...edits.keys()].some(key=>key.startsWith(realm+"\n")))continue;
      const key='trae-'+realm,old=fresh[key]||[],next=exclusionPatch(old,realm);expected[key]=next;
      if(JSON.stringify(next)!==JSON.stringify(old))patches.push({provider:key,models:next});
    }
    for(const patch of patches)await hostAPI('/oauth-excluded-models',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(patch)});
    const verified=exclusionMap(await hostAPI('/oauth-excluded-models'));
    if(epoch!==modelEpoch)return;
    for(const [key,list] of Object.entries(expected))if(JSON.stringify(normalizedExclusions(verified[key]||[]))!==JSON.stringify(normalizedExclusions(list)))throw Error("宿主隐藏设置回读不一致");
    for(const [key,show] of edits){if(show&&exclusionMatches(key.split("\n")[1],verified.trae||[]))throw Error("回读显示模型已被全局锁定");}
    modelExclMap=verified;modelEdits.clear();modelStatus("隐藏设置已保存并核实");toast("隐藏设置已保存并核实");
  }catch(e){
    if(epoch===modelEpoch){modelEdits.clear();toast("隐藏设置未确认","err",e.message);await modelCtlLoad(false,true);modelStatus("隐藏设置未确认；"+(modelStateValid?"已重新读取当前设置":"请刷新目录核实"),true);}
  }finally{modelBusy=false;renderModelGroups()}
}
let promotionsData=null,promotionsReceivedAt=0;
function snapshotNow(data){
  const server=promoTimestamp(data&&data.server_time);
  return Number.isFinite(server)?server+Math.max(0,Date.now()-promotionsReceivedAt):Date.now();
}
function promoTimestamp(value){return typeof value==='number'?value*1000:typeof value==='string'&&value?Date.parse(value):NaN;}
function promoTime(value,zone){
  if(value==null||value==='')return '';
  const date=new Date(promoTimestamp(value));if(!Number.isFinite(date.getTime()))return String(value);
  if(!zone)return date.toISOString().replace('T',' ').replace('.000Z',' UTC');
  try{return new Intl.DateTimeFormat('zh-CN',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(date);}catch(e){return String(value);}
}
function promoWeekdays(days){
  if(!Array.isArray(days)||!days.length)return '';
  if(!days.every(n=>Number.isInteger(n)&&n>=1&&n<=7))return 'weekday '+days.join('/');
  const ordered=[...new Set(days)].sort((a,b)=>a-b),key=ordered.join(',');
  if(key==='1,2,3,4,5,6,7')return '每天';
  if(key==='1,2,3,4,5')return '周一至周五';
  if(key==='6,7')return '周末';
  return ordered.map(n=>'周'+['一','二','三','四','五','六','日'][n-1]).join('/');
}
function promoWindow(window,sharedZone=''){
  const minute=n=>Number.isInteger(n)&&n>=0&&n<=1440?String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'):'?';
  const start=window.start_minute,end=window.end_minute;
  const days=promoWeekdays(window.weekdays);
  return (days?days+' · ':'')+minute(start)+'–'+minute(end)+(Number.isInteger(start)&&Number.isInteger(end)&&end<start?'（跨午夜）':'')+(window.time_zone&&window.time_zone!==sharedZone?' · '+window.time_zone:'');
}
function promoState(item,data){
  const states=['active','upcoming','expired','ended','inactive','unknown'];
  // The server owns timezone/window evaluation. No local-time activation guesses.
  const status=states.includes(item.status)?item.status:'unknown';
  const now=snapshotNow(data),end=promoTimestamp(item.end_at),boundary=promoTimestamp(item.next_change);
  if(Number.isFinite(end)&&now>=end)return 'expired';
  if(status==='expired'||status==='ended')return status;
  if(item.snapshot_stale===true)return 'unknown';
  // A past boundary invalidates the observed state; do not infer activation,
  // a new price or timezone/window behavior without another server snapshot.
  if(Number.isFinite(boundary)&&now>=boundary)return 'unknown';
  return status;
}
function groupedPromotions(data){
  const groups=new Map();
  for(const item of Array.isArray(data.items)?data.items:[]){
    const state=promoState(item,data);
    // Deduplicate only identical facts. Different realms, prices, models,
    // time windows or states must remain separate account-scoped observations.
    const key=JSON.stringify({realm:item.realm,models:item.models||[item.model_id||item.model||''],title:item.title,kind:item.kind,state,
      discount_type:item.discount_type,discount_percent:item.discount_percent,factor:item.factor,multiplier:item.multiplier,base_multiplier:item.base_multiplier,
      start_at:item.start_at,end_at:item.end_at,time_zone:item.time_zone,time_windows:item.time_windows,status_reason:item.status_reason,next_change:item.next_change});
    if(!groups.has(key))groups.set(key,{...item,_state:state,_scopes:new Set(),_fetched:new Set()});
    if(typeof item.account_scope==='string'&&item.account_scope)groups.get(key)._scopes.add(item.account_scope);
    if(item.fetched_at)groups.get(key)._fetched.add(item.fetched_at);
  }
  const rank={active:0,upcoming:1,inactive:2,unknown:3,expired:4,ended:4};
  return [...groups.values()].sort((a,b)=>rank[a._state]-rank[b._state]);
}
function promoStatusLabel(item){
 const state=item._state;if(state!=='unknown')return {active:'进行中',upcoming:'未开始',expired:'已结束',ended:'已结束',inactive:item.status_reason==='upstream_disabled'?'上游已停用':'时段外'}[state]||'条件未提供';
 if(item.snapshot_stale===true||item.status_reason==='snapshot_stale')return '快照已过期';
 if(item.next_change&&snapshotNow(promotionsData)>=promoTimestamp(item.next_change))return '时段已变化，需刷新';
 const reasons={missing_timezone:'上游未提供时区',unsupported_timezone_or_weekdays:'时区或星期规则不明',unsupported_schedule:'时间规则不完整',invalid_bounds:'起止时间不完整',membership_not_confirmed:'会员资格未确认',rate_observation_crossed_boundary:'时段已变化，需刷新'};
 if(reasons[item.status_reason])return reasons[item.status_reason];
 if(item.kind==='member')return '会员资格未确认';
 if((item.time_windows||[]).some(w=>!w.time_zone)&&!item.time_zone)return '上游未提供时区';
 return '上游未提供适用条件';
}
function promoRow(item,zone){
 const state=item._state,on=state==='active',label=promoStatusLabel(item);
 const models=Array.isArray(item.models)?item.models.join(' / '):item.model_id||item.model||'';
 const kind=item.kind==='current'&&item.discount_type?item.discount_type:item.title||item.kind;
 const title=({current:'当前优惠',promotion:'限时活动',discount:'折扣活动',off_peak:'闲时折扣',subsidy:'平台补贴',member:'会员专享',limited:'限时优惠'})[kind]||item.title||kind||'上游活动';
 const price=typeof item.multiplier==='number'?item.multiplier+'×':typeof item.factor==='number'?'折扣系数 '+item.factor:typeof item.discount_percent==='number'?item.discount_percent+'%':'倍率未上报';
 const windowItems=Array.isArray(item.time_windows)?item.time_windows:[];
 const windowZones=[...new Set(windowItems.map(w=>w.time_zone).filter(Boolean))];
 const timeZone=item.time_zone||zone||(windowZones.length===1?windowZones[0]:'');
 const windows=windowItems.map(w=>promoWindow(w,timeZone)).join('；');
 const range=[item.start_at?promoTime(item.start_at,timeZone)+' 起':'',item.end_at?promoTime(item.end_at,timeZone)+' 止':''].filter(Boolean).join(' → ');
 const schedule=[windows,range,timeZone,item.next_change?'下次变化 '+promoTime(item.next_change,timeZone):''].filter(Boolean).join(' · ');
 const scopes=[...item._scopes];
 return `<div class="promo-row ${on?'on':'off'}"><span class="promo-badge${on?' on':''}">${esc(title)}</span><span class="promo-model" title="${escAttr(models)}">${esc(models||'范围未上报')}</span><span class="promo-price" title="${escAttr('快照时间 '+([...item._fetched].map(t=>promoTime(t,'')).join(' / ')||'未上报'))}">${esc(price)}${state==='unknown'?'（参考）':''}</span><span class="promo-realm" title="${escAttr(scopes.join(' / '))}">${esc(({cn:'CN',solo:'SOLO',intl:'Intl'})[item.realm]||item.realm||'范围未上报')}${scopes.length>1?' · '+scopes.length+' 个账号':''}</span><span class="promo-state${on?' on':''}">${esc(label)}${schedule?'<br>'+esc(schedule):''}</span></div>`;
}
function renderPromotions(data){
 if(data!==promotionsData)promotionsReceivedAt=Date.now();
 promotionsData=data||{status:'unknown',items:[]};data=promotionsData;
 const items=groupedPromotions(data),active=items.filter(i=>i._state==='active').length,known=data.status==='known';
 const inactive=items.filter(i=>i._state==='upcoming'||i._state==='inactive').length,unknown=items.filter(i=>i._state==='unknown').length;
 const count=document.getElementById('promoCount');count.textContent=items.length?active+' 进行中'+(inactive?' · '+inactive+' 未生效':'')+(unknown?' · '+unknown+' 条件信息不完整':''):(known?'暂无活动':'暂无活动数据');count.className='promo-live'+(active?'':' zero');
 const zone=data.time_zone||data.timezone||'';
 const fetched=(data.items||[]).map(item=>promoTimestamp(item.fetched_at)).filter(Number.isFinite).sort((a,b)=>a-b);
 const snapshot=fetched.length?'更新 '+promoTime(fetched[0]/1000,zone)+(fetched.at(-1)!==fetched[0]?' — '+promoTime(fetched.at(-1)/1000,zone):''):'更新时间未上报';
 document.getElementById('promoMeta').textContent=snapshot+(zone?' · '+zone:'');
 const rows=items.map(item=>promoRow(item,zone));
 document.getElementById('promoList').innerHTML=rows.slice(0,6).join('')+(rows.length>6?`<details id="promoMore"><summary class="promo-meta">展开其余 ${rows.length-6} 项</summary><div class="promo-list">${rows.slice(6).join('')}</div></details>`:'')||(known?'<div class="promo-meta">当前快照未列出活动</div>':'<div class="promo-meta">尚未取得活动信息，可手动刷新目录</div>');
}
// Local presentation only. Scheduled upstream discovery belongs to the backend;
// neither page startup, unknown metadata, visibility nor a time boundary fetches it.
function minuteTick(){
  if(document.hidden)return;
  if(promotionsData){
    const more=document.getElementById('promoMore'),expanded=more&&more.open;
    renderPromotions(promotionsData);
    const next=document.getElementById('promoMore');if(next&&expanded)next.open=true;
  }
  // Refresh readonly cells only, so a local clock tick cannot detach a focused
  // hide control or an in-progress drag handle.
  if(modelGroupsData&&!modelBusy&&!modelLoading){
    const rows=catalogRows();
    document.getElementById('modelGroupsBox').querySelectorAll('[data-model-id]').forEach(row=>{
      const model=rows.find(m=>m.id===row.dataset.modelId);if(!model)return;
      let index=0;
      for(const realm of ['cn','solo','intl'])if(model.channels[realm]){
        const cell=row.querySelectorAll('.realm-cell')[index++],wrapper=document.createElement('div');
        wrapper.innerHTML=modelChannelCell(realm,model.channels[realm]);
        if(cell&&wrapper.firstChild)cell.replaceWith(wrapper.firstChild);
      }
    });
  }
}
async function startModelMetadata(){return modelCtlLoad();}
setInterval(minuteTick,60000);
if(document.addEventListener)document.addEventListener('visibilitychange',minuteTick);
let autoCheckinEpoch=0,autoCheckinBusy=false,autoCheckinKnown=false,autoCheckinValue=true;
function configuredCheckin(config){if(!config||typeof config!=="object"||Array.isArray(config)||config.error)throw Error("自动签到配置未返回");if(config.checkin_auto!=null&&typeof config.checkin_auto!=="boolean")throw Error("自动签到配置格式异常");return config.checkin_auto!==false;}
async function loadAutoCheckin(){
  if(autoCheckinBusy)return;
  const epoch=++autoCheckinEpoch,input=document.getElementById('autoCheckin');input.disabled=true;autoCheckinKnown=false;
  try{const config=await hostAPI('/plugins/'+providerName+'/config');if(epoch!==autoCheckinEpoch)return;autoCheckinValue=configuredCheckin(config);input.checked=autoCheckinValue;autoCheckinKnown=true;document.getElementById('autoCheckinStatus').textContent='';}
  catch(e){if(epoch===autoCheckinEpoch)document.getElementById('autoCheckinStatus').textContent='待核实';}
  finally{if(epoch===autoCheckinEpoch)input.disabled=!autoCheckinKnown;}
}
async function saveAutoCheckin(input){
  if(autoCheckinBusy||!autoCheckinKnown)return;
  const value=input.checked;autoCheckinBusy=true;input.disabled=true;++autoCheckinEpoch;
  document.getElementById('autoCheckinStatus').textContent='保存中';
  try{
    await hostAPI('/plugins/'+providerName+'/config',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({checkin_auto:value})});
    const [config,status]=await Promise.all([hostAPI('/plugins/'+providerName+'/config'),api('/status')]);
    if(configuredCheckin(config)!==value||!status||status.checkin_auto!==value)throw Error('宿主或运行时回读不一致');
    autoCheckinValue=value;toast('自动签到设置已保存并核实');
  }catch(e){toast('自动签到设置未确认','err',e.message);}
  finally{autoCheckinBusy=false;await loadAutoCheckin();}
}
/* Start theme sync watcher (parent MutationObserver + standalone prefers-color-scheme listener). */
if(window.__traeThemeSync)window.__traeThemeSync();
/* trae plugins don't require a key on the plugin side; attempt the initial
   load directly. If the CPA host middleware returns 401, the auth box surfaces. */
load(false);
startModelMetadata();
loadAutoCheckin();
