name: Trae CPA Plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: plugins/trae/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Registry and repository boundary
        run: python3 scripts/check-release.py
      - name: Offline backend and panel tests
        working-directory: plugins/trae
        run: |
          go test -race -count=1 ./...
          go vet ./...
          node --test panel.test.js
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-latest, os: linux, arch: amd64, cc: gcc}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, cc: gcc}
          - {runner: macos-14, os: darwin, arch: arm64, cc: clang}
          - {runner: macos-14, os: darwin, arch: amd64, cc: 'clang -arch x86_64'}
          - {runner: windows-latest, os: windows, arch: amd64, cc: gcc}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: plugins/trae/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up Windows C compiler
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Build on Unix
        if: matrix.os != 'windows'
        env:
          CC: ${{ matrix.cc }}
        run: bash scripts/build.sh '${{ matrix.os }}' '${{ matrix.arch }}'
      - name: Build on Windows
        if: matrix.os == 'windows'
        shell: msys2 {0}
        env:
          CC: gcc
        run: bash scripts/build.sh windows amd64
      - uses: actions/upload-artifact@v4
        with:
          name: trae-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/trae_*.zip
            dist/trae_*.sha256
          if-no-files-found: error
  release:
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches provider version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "${RELEASE_TAG#v}" = "$(tr -d '[:space:]' < plugins/trae/VERSION)"
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate archive checksums
        run: python3 -c "from pathlib import Path; import hashlib; p=Path('release'); (p/'checksums.txt').write_text(''.join(hashlib.sha256(f.read_bytes()).hexdigest()+'  '+f.name+'\n' for f in sorted(p.glob('*.zip'))))"
      - uses: softprops/action-gh-release@v2
        with:
          name: trae-cpa-plugin ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/trae_*.zip
            release/checksums.txt
